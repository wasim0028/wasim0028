<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="Segoe UI, Ubuntu, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050B1F"/><stop offset="0.55" stop-color="#0B1E4A"/><stop offset="1" stop-color="#0A3B6B"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0" stop-color="#7DD3FC"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1E3A8A" stroke-opacity="0.35" stroke-width="1"/>
    </pattern>
    <style>
      .flow{stroke-dasharray:8 10;animation:dash 1.6s linear infinite}
      .spin{transform-origin:1040px 150px;animation:rot 22s linear infinite}
      .float{animation:fl 6s ease-in-out infinite}
      .blink{animation:bl 1.1s steps(1) infinite}
      @keyframes dash{to{stroke-dashoffset:-36}}
      @keyframes rot{to{transform:rotate(360deg)}}
      @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes bl{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="1040" cy="150" r="190" fill="url(#glow)"/>

  <!-- pipeline -->
  <g stroke="#38BDF8" stroke-width="2.5" fill="none" class="flow" opacity="0.9">
    <path d="M70 250 H300 M360 250 H560 M620 250 H820"/>
  </g>
  <g font-size="13" fill="#E0F2FE" text-anchor="middle">
    <g><rect x="300" y="236" width="60" height="28" rx="8" fill="#0F2A5C" stroke="#38BDF8"/><text x="330" y="255">build</text></g>
    <g><rect x="560" y="236" width="60" height="28" rx="8" fill="#0F2A5C" stroke="#34D399"/><text x="590" y="255">test</text></g>
    <g><rect x="820" y="236" width="70" height="28" rx="8" fill="#0F2A5C" stroke="#A78BFA"/><text x="855" y="255">deploy</text></g>
    <circle cx="70" cy="250" r="7" fill="#38BDF8"/>
  </g>

  <!-- helm / kubernetes style wheel -->
  <g class="spin" fill="none" stroke="#7DD3FC" stroke-width="4" stroke-linecap="round" opacity="0.95">
    <circle cx="1040" cy="150" r="78"/>
    <circle cx="1040" cy="150" r="22"/>
    <g id="sp"><path d="M1040 72 V128"/></g>
    <use href="#sp" transform="rotate(51.4 1040 150)"/><use href="#sp" transform="rotate(102.8 1040 150)"/>
    <use href="#sp" transform="rotate(154.2 1040 150)"/><use href="#sp" transform="rotate(205.6 1040 150)"/>
    <use href="#sp" transform="rotate(257 1040 150)"/><use href="#sp" transform="rotate(308.4 1040 150)"/>
  </g>

  <!-- cloud -->
  <g transform="translate(900 40)"><g class="float"><g fill="#E0F2FE" fill-opacity="0.92"><circle cx="30" cy="40" r="18"/><circle cx="55" cy="26" r="26"/><circle cx="82" cy="38" r="20"/><rect x="12" y="38" width="88" height="22" rx="11"/></g></g></g>
  <g transform="translate(1085 205) scale(0.7)"><g class="float" style="animation-delay:-3s"><g fill="#BAE6FD" fill-opacity="0.8"><circle cx="30" cy="40" r="18"/><circle cx="55" cy="26" r="26"/><circle cx="82" cy="38" r="20"/><rect x="12" y="38" width="88" height="22" rx="11"/></g></g></g>

  <!-- text -->
  <text x="70" y="108" font-size="22" fill="#7DD3FC" letter-spacing="6">DEVOPS ENGINEER</text>
  <text x="70" y="178" font-size="68" font-weight="800" fill="url(#title)">Wasim Akram</text>
  <text x="70" y="214" font-size="20" fill="#BFDBFE">Kubernetes · Terraform · ArgoCD · CI/CD · AWS</text>
  </svg>
